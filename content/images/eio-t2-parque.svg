  <path d="M260 600 l420 -10 l60 150 l-520 15z" fill="#e45b5b"/>
  <g stroke="#ffffff" stroke-width="10" opacity="0.8">
    <line x1="330" y1="598" x2="300" y2="752"/><line x1="420" y1="596" x2="410" y2="749"/><line x1="510" y1="594" x2="520" y2="747"/><line x1="600" y1="592" x2="630" y2="745"/>
    <line x1="275" y1="640" x2="690" y2="630"/><line x1="290" y1="690" x2="710" y2="680"/>
  </g>
