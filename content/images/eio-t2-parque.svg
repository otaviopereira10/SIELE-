  <g stroke="#c62828" stroke-width="6" fill="none"><circle cx="120" cy="690" r="32"/><circle cx="210" cy="690" r="32"/><path d="M120 690 l35 -55 h35 l20 55 M155 635 l15 55"/></g>
  <g><circle cx="1000" cy="700" r="9" fill="#e91e63"/><circle cx="1030" cy="715" r="9" fill="#ffeb3b"/><circle cx="1060" cy="698" r="9" fill="#9c27b0"/><circle cx="1090" cy="712" r="9" fill="#ff9800"/></g>
</svg>
