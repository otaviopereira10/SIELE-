    <rect x="940" y="480" width="80" height="50" fill="#f5f0e1" stroke="#999" stroke-width="2"/>
    <line x1="980" y1="480" x2="980" y2="530" stroke="#999" stroke-width="2"/>
    <circle cx="970" cy="422" r="3.5" fill="#222"/><circle cx="990" cy="422" r="3.5" fill="#222"/>
